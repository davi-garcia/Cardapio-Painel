<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Delisil</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #1a0631; color: white; display: flex; justify-content: center; padding: 20px; }
        .admin-box { width: 100%; max-width: 500px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #4caf50; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        .link-item { background: rgba(0,0,0,0.3); padding: 10px; margin: 10px 0; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; }
        .btn-delete { background: #ff4b2b; width: auto; padding: 5px 10px; font-size: 12px; margin-top:0; }
        #admin-content { display: none; }
    </style>
</head>
<body>

    <div class="admin-box">
        <div id="login-screen">
            <h2>🔐 Login Administrativo</h2>
            <input type="text" id="user" placeholder="Usuário">
            <input type="password" id="pass" placeholder="Senha">
            <button id="btnLogin">Entrar</button>
        </div>

        <div id="admin-content">
            <h2>🛠 Gerenciar Links</h2>
            <input type="text" id="new-title" placeholder="Título (Ex: Instagram)">
            <input type="text" id="new-url" placeholder="URL (https://...)">
            <select id="new-icon">
                <option value="ph ph-link">🔗 Link Padrão</option>
                <option value="ph ph-instagram-logo">📸 Instagram</option>
                <option value="ph ph-whatsapp-logo">💬 WhatsApp</option>
                <option value="ph ph-map-pin">📍 Localização</option>
                <option value="ph ph-shopping-cart">🛒 Cardápio</option>
            </select>
            <button id="btnAdd">Adicionar Link</button>
            <hr>
            <div id="links-container">Carregando...</div>
            <button onclick="location.reload()" style="background:#666">Sair</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwazCVEVkolnyRbIJAx2a4_IpMtXoZ-Js",
            authDomain: "delisil.firebaseapp.com",
            projectId: "delisil",
            storageBucket: "delisil.firebasestorage.app",
            messagingSenderId: "90955672138",
            appId: "1:90955672138:web:79b2df6037611badd7d4b3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let linksAtuais = [];

        // Login Simples
        document.getElementById('btnLogin').onclick = () => {
            if(document.getElementById('user').value === 'admin' && document.getElementById('pass').value === 'admin1234') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                carregarLinks();
            } else { alert('Dados incorretos!'); }
        };

        async function carregarLinks() {
            const docSnap = await getDoc(doc(db, "config", "links"));
            if (docSnap.exists()) {
                linksAtuais = docSnap.data().meusLinks;
            } else {
                linksAtuais = [];
            }
            renderizar();
        }

        function renderizar() {
            const container = document.getElementById('links-container');
            container.innerHTML = linksAtuais.map((item, index) => `
                <div class="link-item">
                    <span>${item.title}</span>
                    <button class="btn-delete" onclick="remover(${index})">Remover</button>
                </div>
            `).join('');
        }

        document.getElementById('btnAdd').onclick = async () => {
            const title = document.getElementById('new-title').value;
            let url = document.getElementById('new-url').value;
            const icon = document.getElementById('new-icon').value;

            if(!title || !url) return alert('Preencha tudo!');
            if(!url.startsWith('http')) url = 'https://' + url;

            linksAtuais.push({ title, url, icon });
            await setDoc(doc(db, "config", "links"), { meusLinks: linksAtuais });
            
            document.getElementById('new-title').value = '';
            document.getElementById('new-url').value = '';
            renderizar();
        };

        window.remover = async (index) => {
            linksAtuais.splice(index, 1);
            await setDoc(doc(db, "config", "links"), { meusLinks: linksAtuais });
            renderizar();
        };
    </script>
</body>
</html>
