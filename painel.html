<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Delisil</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; background: #1a0631; color: white; display: flex; justify-content: center; padding: 20px; }
        .admin-box { width: 100%; max-width: 500px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; box-sizing: border-box; display: block; }
        button { width: 100%; padding: 12px; background: #4caf50; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 10px; box-sizing: border-box;}
        .link-item { background: rgba(0,0,0,0.3); padding: 10px; margin: 10px 0; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; }
        .btn-delete { background: #ff4b2b; width: auto; padding: 5px 10px; font-size: 12px; }
        #login-screen { text-align: center; }
        #admin-content { display: none; }
    </style>
</head>
<body>

    <div class="admin-box">
        <div id="login-screen">
            <h2>🔐 Login</h2>
            <input type="text" id="user" placeholder="Usuário">
            <input type="password" id="pass" placeholder="Senha">
            <button onclick="login()">Entrar</button>
        </div>

        <div id="admin-content">
            <h2>🛠 Gerenciar Links</h2>
            
            <div id="form-novo">
                <h4>Adicionar Novo Link</h4>
                <input type="text" id="new-title" placeholder="Título (Ex: TikTok)">
                <input type="text" id="new-url" placeholder="URL (https://...)">
                <select id="new-icon">
                    <option value="ph ph-link">🔗 Link Padrão</option>
                    <option value="ph ph-instagram-logo">📸 Instagram</option>
                    <option value="ph ph-facebook-logo">👤 Facebook</option>
                    <option value="ph ph-whatsapp-logo">💬 WhatsApp</option>
                    <option value="ph ph-map-pin">📍 Localização</option>
                    <option value="ph ph-google-logo">🌐 Google</option>
                    <option value="ph ph-wifi-high">📶 Wi-Fi</option>
                    <option value="ph ph-shopping-cart">🛒 Loja</option>
                    <option value="ph ph-x-logo">✖️ X (Twitter)</option>
                    <option value="ph ph-google-drive-logo">📂 Google Drive</option>
                    <option value="ph ph-google-play-logo">🤖 PlayStore</option>
                    <option value="ph ph-app-store-logo">🍎 Apple Store</option>
                    <option value="ph ph-linkedin-logo">💼 LinkedIn</option>
                    <option value="ph ph-music-notes">🎵 Músicas (Spotify/Deezer)</option>
                    <option value="ph ph-calendar">📅 Agenda / Reservas</option>
                    <option value="ph ph-clock">⏰ Horários</option>
                    <option value="ph ph-house-line">🏠 AirBnb</option>
                    <option value="ph ph-currency-dollar">💰 Pagamento</option>
                </select>
                <button onclick="addLink()">Adicionar Div</button>
            </div>

            <hr style="margin: 20px 0; opacity: 0.2;">
            <h4>Links Ativos</h4>
            <div id="links-container">Carregando links...</div>
            <button onclick="logout()" style="background: #666; margin-top: 30px;">Sair</button>
        </div>
    </div>

    <script type="module">
        // COLE SUAS CREDENCIAIS AQUI
        const firebaseConfig = {
            apiKey: "AIzaSyAwazCVEVkolnyRbIJAx2a4_IpMtXoZ-Js",
            authDomain: "delisil.firebaseapp.com",
            projectId: "delisil",
            storageBucket: "delisil.firebasestorage.app",
            messagingSenderId: "90955672138",
            appId: "1:90955672138:web:79b2df6037611badd7d4b3",
            measurementId: "G-C257TGX405"
        };


        // Initialize Firebase
            const app = initializeApp(firebaseConfig);
            const analytics = getAnalytics(app);
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function login() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(u === 'admin' && p === 'admin1234') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                renderLinks();
            } else { alert('Acesso negado!'); }
        }

        function renderLinks() {
            const container = document.getElementById('links-container');
            db.ref('links').on('value', (snapshot) => {
                const links = snapshot.val() || [];
                container.innerHTML = '';
                
                if (links.length === 0) {
                    container.innerHTML = '<p style="opacity:0.5">Nenhum link ativo no banco de dados.</p>';
                }

                links.forEach((item, index) => {
                    container.innerHTML += `
                        <div class="link-item">
                            <span><i class="${item.icon}"></i> ${item.title}</span>
                            <button class="btn-delete" onclick="removeLink(${index})">Remover</button>
                        </div>`;
                });
            });
        }

        function addLink() {
            const title = document.getElementById('new-title').value;
            let url = document.getElementById('new-url').value.trim();
            const icon = document.getElementById('new-icon').value;

            if(!title || !url) return alert('Preencha tudo!');
            if (!url.startsWith('http')) url = 'https://' + url;

            db.ref('links').once('value').then((snapshot) => {
                let links = snapshot.val() || [];
                links.push({ title, url, icon });
                db.ref('links').set(links).then(() => {
                    document.getElementById('new-title').value = '';
                    document.getElementById('new-url').value = '';
                });
            });
        }

        function removeLink(index) {
            db.ref('links').once('value').then((snapshot) => {
                let links = snapshot.val() || [];
                links.splice(index, 1);
                db.ref('links').set(links);
            });
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
