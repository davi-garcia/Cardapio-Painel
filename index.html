<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delisil - Doceria</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary-bg: #2d0a4e; --accent-purple: #020202; --glass-bg: rgba(255, 255, 255, 0.1); --glass-border: rgba(255, 255, 255, 0.2); --text-color: #ffffff; }
        body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #1a0631 0%, #000000 100%); background-attachment: fixed; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--text-color); }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('img/fundo.webp'); background-size: cover; background-position: center; filter: blur(15px) brightness(0.4); transform: scale(1.1); z-index: -1; }
        .container { width: 100%; max-width: 450px; padding: 40px 20px; text-align: center; box-sizing: border-box; }
        .logo-wrapper { width: 120px; height: 120px; background: white; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; border: 4px solid var(--accent-purple); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .logo-wrapper img { width: 85%; height: auto; }
        h1 { font-size: 1.5rem; margin: 0; font-weight: 600; }
        p { font-size: 0.9rem; opacity: 0.8; margin: 5px 0 20px; }
        .btn-main { background: transparent; border: 2px solid #fff; color: white; padding: 10px 25px; border-radius: 50px; text-decoration: none; font-weight: 600; transition: 0.3s; display: inline-block; margin-bottom: 40px; }
        .btn-header { display: block; max-width: 240px; margin: 20px auto; padding: 10px 30px; font-size: 15px; margin-top: -15px; }
        .links-list { display: flex; flex-direction: column; gap: 15px; }
        .link-card { background: var(--glass-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--glass-border); padding: 16px; border-radius: 15px; display: flex; align-items: center; text-decoration: none; color: white; transition: transform 0.2s; cursor: pointer; position: relative; }
        .link-card i { font-size: 24px; margin-right: 15px; width: 30px; }
        .link-card span { flex-grow: 1; text-align: left; }
        #pixModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 20px; text-align: center; width: 90%; max-width: 400px; position: relative; }
        .close { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-wrapper"><img src="img/logo.png" alt="Delisil"></div>
            <h1>Delisil</h1>
            <p>A Doceria 01 da cidade!</p>
            <a href="javascript:void(0)" id="downloadVCard" class="btn-main btn-header">📒 Salvar na agenda</a>
            <a href="tel:5521968439249" class="btn-main btn-header">📞 Ligar</a>
        </div>
        <div class="links-list" id="dynamic-links">
            <p>Carregando links...</p>
        </div>
    </div>

    <div id="pixModal">
        <div class="modal-content">
            <span class="close" id="closeModal">×</span>
            <h2 style="color:white;">Pagar via PIX</h2>
            <img src="img/qrcode.png" style="max-width:80%; border-radius:15px;"><br><br>
            <img src="img/logo_pix.png" style="max-width:100%;">
            <p style="margin-top:15px; color:white;">Abra o pix do seu banco e pague através do QR Code ou Chave Aleatória.</p>
            <div class="link-card" style="justify-content:center;" id="btn-pix-modal">
                <i class="ph ph-copy"></i>
                <span>Copiar PIX (Chave Aleatória)</span>
                <small id="status-pix-modal" style="display:none; color:#4caf50; margin-left:10px;">Copiado!</small>
            </div>   
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwazCVEVkolnyRbIJAx2a4_IpMtXoZ-Js",
            authDomain: "delisil.firebaseapp.com",
            projectId: "delisil",
            storageBucket: "delisil.firebasestorage.app",
            messagingSenderId: "90955672138",
            appId: "1:90955672138:web:79b2df6037611badd7d4b3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        onSnapshot(doc(db, "config", "links"), (docSnap) => {
            const container = document.getElementById('dynamic-links');
            if (docSnap.exists()) {
                renderizar(docSnap.data().meusLinks);
            } else {
                container.innerHTML = "<p>Nenhum link ativo.</p>";
            }
        });

        function renderizar(links) {
            const container = document.getElementById('dynamic-links');
            let html = links.map(link => `
                <a href="${link.url}" target="_blank" class="link-card">
                    <i class="${link.icon}"></i>
                    <span>${link.title}</span>
                </a>
            `).join('');

            html += `
                <div class="link-card" id="btn-pix-lista">
                    <i class="ph ph-copy"></i>
                    <span>Chave PIX</span>
                    <small id="status-pix" style="display:none; color:#4caf50; margin-left:10px;">Copiado!</small>
                </div>
                <div class="link-card" id="showImageBtn">
                    <i class="ph ph-qr-code"></i>
                    <span>Pagar via PIX (QrCode)</span>
                </div>
            `;
            container.innerHTML = html;
            
            document.getElementById('btn-pix-lista').onclick = () => copiar("21968439249", "status-pix");
            document.getElementById('showImageBtn').onclick = () => document.getElementById('pixModal').style.display = "flex";
            document.getElementById('closeModal').onclick = () => document.getElementById('pixModal').style.display = "none";
            document.getElementById('btn-pix-modal').onclick = () => copiar("1c0ba67a-340c-4ed9-b7cc-abdcaba60de8", "status-pix-modal");
        }

        function copiar(texto, id) {
            navigator.clipboard.writeText(texto);
            const s = document.getElementById(id);
            s.style.display = "inline";
            setTimeout(() => s.style.display = "none", 2000);
        }

        document.getElementById('downloadVCard').onclick = () => {
            const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:Delisil\nTEL;TYPE=CELL:+5521968439249\nEND:VCARD`;
            const blob = new Blob([vcard], { type: "text/vcard" });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "Delisil.vcf"; a.click();
        };
    </script>
</body>
</html>
